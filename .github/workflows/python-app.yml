name: Build and Package Python App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest  # Koristimo windows-latest jer pravimo .exe za Windows

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl pyinstaller
        
    - name: Build with PyInstaller
      run: |
        # Zamenite 'vaseskripte.py' sa stvarnim imenom vašeg fajla
        pyinstaller --onefile --name "WAJA_Processor" WAJA_AOI_XLS.py
        
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: WAJA-Processor-EXE
        path: dist/WAJA_Processor.exe
